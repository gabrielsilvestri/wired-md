<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>wired-md</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="../../node_modules/vditor/dist/index.css">
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <style id="theme-style"></style>
  <style id="custom-style"></style>
</head>
<body>
  <header id="titlebar">
    <div id="titlebar-left">
      <button class="tb-btn" id="btn-toggle-sidebar" title="Barra lateral (mostrar ou ocultar)" aria-label="Barra lateral">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <span class="tb-sep"></span>
      <button class="tb-btn" id="btn-terminal" title="Terminal (Ctrl+`)" aria-label="Terminal">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/></svg>
      </button>
      <button class="tb-btn" id="btn-claude-file" title="Mandar arquivo pro claude" aria-label="Mandar arquivo pro claude">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/></svg>
      </button>
      <button class="tb-btn" id="btn-claude-sel" title="Mandar seleção pro claude" aria-label="Mandar seleção pro claude">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3a2 2 0 0 0-2 2"/><path d="M19 3a2 2 0 0 1 2 2"/><path d="M21 19a2 2 0 0 1-2 2"/><path d="M5 21a2 2 0 0 1-2-2"/><path d="M9 3h1"/><path d="M9 21h1"/><path d="M14 3h1"/><path d="M14 21h1"/><path d="M3 9v1"/><path d="M21 9v1"/><path d="M3 14v1"/><path d="M21 14v1"/><path d="M7 12h10"/></svg>
      </button>
    </div>
    <div id="titlebar-center">
      <span id="titlebar-title">wired-md</span>
    </div>
    <div id="titlebar-controls">
      <button id="win-min" title="Minimizar" aria-label="Minimizar">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="win-max" title="Maximizar" aria-label="Maximizar">
        <svg class="ico-max" width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        <svg class="ico-restore" width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 2.5V0.5h7v7h-2" fill="none" stroke="currentColor" stroke-width="1"/><rect x="0.5" y="2.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/></svg>
      </button>
      <button id="win-close" title="Fechar" aria-label="Fechar">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
    </div>
  </header>
  <div id="app">
    <aside id="sidebar">
      <div id="sidebar-header">
        <span id="sidebar-root-name" title="">sem pasta</span>
        <button class="tb-btn" id="btn-root-explorer" title="Abrir a pasta no Explorer" aria-label="Abrir a pasta no Explorer">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
      <div id="tree-toolbar">
        <button class="tb-btn" id="btn-tree-new-file" title="Novo arquivo .md" aria-label="Novo arquivo .md">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M15 2v5h5"/><path d="M12 12v6"/><path d="M9 15h6"/></svg>
        </button>
        <button class="tb-btn" id="btn-tree-new-folder" title="Nova pasta" aria-label="Nova pasta">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/><path d="M12 10v6"/><path d="M9 13h6"/></svg>
        </button>
        <button class="tb-btn" id="btn-tree-sort" title="Ordenação" aria-label="Ordenação">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="m21 8-4-4-4 4"/><path d="M17 4v16"/></svg>
        </button>
        <button class="tb-btn" id="btn-tree-collapse" title="Colapsar tudo" aria-label="Colapsar tudo">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m7 20 5-5 5 5"/><path d="m7 4 5 5 5-5"/></svg>
        </button>
        <button class="tb-btn" id="btn-tree-search" title="Buscar na árvore" aria-label="Buscar na árvore">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </button>
      </div>
      <div id="tree-search-wrap" class="hidden">
        <input type="text" id="tree-search" spellcheck="false" placeholder="filtrar por nome... (Esc limpa)">
      </div>
      <div id="file-tree"></div>
      <div id="sidebar-empty">nenhuma pasta aberta</div>
      <div id="recent-section">
        <div id="recent-header">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          <span>recentes</span>
        </div>
        <ul id="recent-list"></ul>
      </div>
      <div id="sidebar-footer">
        <button class="tb-btn" id="btn-config" title="Configurações" aria-label="Configurações">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </aside>
    <div id="sidebar-resizer" title="Arrastar para redimensionar"></div>
    <div id="main-col">
      <div id="panes" class="single"></div>
      <div id="terminal-panel" class="hidden">
        <div id="terminal-bar">
          <span id="terminal-title">terminal</span>
          <span id="terminal-cwd"></span>
          <span class="toolbar-spacer"></span>
          <button id="btn-term-cd" title="Ir para a pasta da nota atual (cd)" aria-label="Ir para a pasta da nota atual">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6v6a2 2 0 0 0 2 2h12"/><path d="m15 10 4 4-4 4"/></svg>
          </button>
          <button id="btn-claude" title="Digitar o comando claude no shell">claude</button>
          <button id="btn-term-close" title="Fechar terminal">✕</button>
        </div>
        <div id="terminal-host"></div>
      </div>
    </div>
  </div>

  <div id="ctx-menu" class="hidden"></div>

  <div id="input-overlay" class="hidden">
    <div id="input-box">
      <div id="input-title"></div>
      <input type="text" id="input-field" spellcheck="false">
      <div id="input-actions">
        <button id="input-cancel">cancelar</button>
        <button id="input-ok">ok</button>
      </div>
    </div>
  </div>

  <div id="palette-overlay" class="hidden">
    <div id="palette">
      <input type="text" id="palette-input" spellcheck="false" placeholder="buscar...">
      <div id="palette-list"></div>
    </div>
  </div>

  <div id="settings-overlay" class="hidden">
    <div id="settings-panel">
      <div id="settings-header">
        <span>configurações</span>
        <button id="btn-settings-close" title="Fechar">✕</button>
      </div>
      <div id="settings-body">
        <section>
          <h3>tema</h3>
          <div class="setting-row">
            <label for="sel-theme">tema ativo</label>
            <select id="sel-theme"></select>
            <button id="btn-open-themes" title="Abrir a pasta de temas no Explorer">pasta</button>
          </div>
          <div class="setting-row">
            <label for="inp-accent">cor de destaque</label>
            <input type="color" id="inp-accent">
            <button id="btn-accent-reset" title="Voltar ao accent do tema">padrão do tema</button>
          </div>
        </section>
        <section>
          <h3>fontes</h3>
          <div class="setting-row">
            <label for="inp-font-body">fonte do documento</label>
            <input type="text" id="inp-font-body" list="font-options" placeholder="padrão do tema">
          </div>
          <div class="setting-row">
            <label for="inp-font-code">fonte de código</label>
            <input type="text" id="inp-font-code" list="font-options" placeholder="padrão do tema">
          </div>
          <datalist id="font-options"></datalist>
          <div class="setting-row">
            <label for="inp-font-size">tamanho do texto</label>
            <input type="number" id="inp-font-size" min="11" max="26" step="1">
            <span class="setting-hint">px</span>
          </div>
        </section>
        <section>
          <h3>snippets de css</h3>
          <p class="setting-hint">arquivos .css na pasta de snippets; ligue os que quiser aplicar por cima do tema.</p>
          <div id="snippet-list"></div>
          <div class="setting-row">
            <button id="btn-open-snippets" title="Abrir a pasta de snippets no Explorer">abrir pasta de snippets</button>
            <button id="btn-reload-snippets" title="Reler a lista de snippets">recarregar lista</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="../../node_modules/vditor/dist/index.min.js"></script>
  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
